name: Post news

on:
  schedule:
    # GitHub Actions cron всегда в UTC. Минск — UTC+3 круглый год (без перехода
    # на летнее время), так что 05:00/10:00/15:00/20:00 UTC = 08:00/13:00/18:00/23:00
    # по Минску — 4 прогона в пределах "дневных" часов, не ночью.
    - cron: '0 5,10,15,20 * * *'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    # Нужно на запись, чтобы шаг "Commit updated database" мог запушить news.db.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Commit updated database
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.db
          git diff --cached --quiet || git commit -m "Update news database"
          git push
