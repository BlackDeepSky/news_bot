name: Post news

on:
  # Таймер перенесён из GitHub `schedule` на внешний будильник cron-job.org:
  # GitHub Actions не гарантирует исполнение cron и отбрасывает большую часть
  # ежечасных слотов (на практике из 16 запускались ~4, самый ранний дайджест
  # почти всегда пропадал). cron-job.org раз в час дёргает этот workflow через
  # workflow_dispatch API (см. инструкцию по настройке), а `schedule` убран,
  # чтобы GitHub-крон и будильник не давали два прогона в один час.
  #
  # Расписание — каждый час 05:00..20:00 UTC = 08:00..23:00 по Минску, 16
  # прогонов по одному посту. Часы 05:00 и 19:00 (= 08:00 и 22:00 Минска)
  # main.py трактует как дайджесты «Главное в мире за день» (см.
  # DIGEST_HOURS_UTC), остальные 14 — обычные новости. 1 пост/час = ~2 запроса
  # к OpenRouter, итого ~30 запросов/сутки, укладывается в лимит free (~50).
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    # Нужно на запись, чтобы шаг "Commit bot data" мог запушить data/.
    permissions:
      contents: write
    # Не даём запускаться одновременно (cron + ручной workflow_dispatch):
    # иначе два прогона гоняются за data/state.json и за git push.
    concurrency:
      group: post-news
      cancel-in-progress: false
    # Зависший внешний хост (feed/trafilatura) не должен жечь весь бюджет
    # джобы (по умолчанию — 6 часов), ограничиваем жёстко.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      # Память бота теперь в текстовых data/: список опубликованных URL и
      # курсор round-robin. Раннер эфемерный, поэтому коммитим обратно в git.
      - name: Commit bot data
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update bot data"
          git push
