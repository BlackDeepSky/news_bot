name: Post news

on:
  # Таймер перенесён из GitHub `schedule` на внешний будильник cron-job.org:
  # GitHub Actions не гарантирует исполнение cron и отбрасывает большую часть
  # ежечасных слотов (на практике из 16 запускались ~4, самый ранний дайджест
  # почти всегда пропадал). cron-job.org раз в час дёргает этот workflow через
  # workflow_dispatch API (см. инструкцию по настройке), а `schedule` убран,
  # чтобы GitHub-крон и будильник не давали два прогона в один час.
  #
  # Расписание — 4 прогона в сутки: 05:00, 10:00, 15:00, 19:00 UTC =
  # 08:00, 13:00, 18:00, 22:00 по Минску, по одному посту. Час 05:00
  # (= 08:00 Минска) main.py трактует как дайджест «Главное в мире за день»
  # (см. DIGEST_HOURS_UTC), остальные 3 — обычные новости. Расход OpenRouter:
  # 3 поста × 2 запроса (selector + process_article) + 1 дайджест = ~7/сутки,
  # укладывается в лимит free (~50).
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    # Нужно на запись, чтобы шаг "Commit bot data" мог запушить data/.
    permissions:
      contents: write
    # Не даём запускаться одновременно (cron + ручной workflow_dispatch):
    # иначе два прогона гоняются за data/state.json и за git push.
    concurrency:
      group: post-news
      cancel-in-progress: false
    # Зависший внешний хост (feed/trafilatura) не должен жечь весь бюджет
    # джобы (по умолчанию — 6 часов), ограничиваем жёстко.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      # Память бота теперь в текстовых data/: список опубликованных URL и
      # курсор round-robin. Раннер эфемерный, поэтому коммитим обратно в git.
      - name: Commit bot data
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update bot data"
          git push

      # cron-job.org видит только ответ dispatch-API (204) и не знает, чем
      # закончился сам прогон, поэтому об упавших джобах сообщаем отдельно.
      # Нужен секрет ALERT_CHAT_ID — id личного чата с ботом (не канала!);
      # без него шаг тихо пропускается. continue-on-error, чтобы ошибка
      # уведомления не замаскировала исходную причину падения.
      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          if [ -z "$ALERT_CHAT_ID" ]; then
            echo "ALERT_CHAT_ID не задан — уведомление пропущено"
            exit 0
          fi
          TEXT="🔴 Прогон news_bot упал: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALERT_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
